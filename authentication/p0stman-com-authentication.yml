summary: >-
  Every public machine surface p0stman exposes is anonymous. The MCP server answered initialize, tools/list
  and a tools/call with no credential and no WWW-Authenticate challenge; the A2A card declares
  authentication.schemes ["None"] and the task endpoint accepted an anonymous JSON-RPC POST; the three
  /api/ai JSON endpoints return 200 to a bare GET; agents.md documents no key, token or sign-up anywhere.
  There is no OAuth authorization server, no OpenID configuration, no protected-resource metadata and no
  developer sign-up - consistent with a surface whose only writes are "send us an enquiry". The two write
  tools identify the caller by the name and email supplied in the tool arguments, not by any credential.
schemes:
- id: none
  type: none
  applies_to:
    mcp: [initialize, tools/list, tools/call book_discovery_call, tools/call submit_inquiry, tools/call get_services, tools/call get_portfolio, tools/call search_content]
    a2a: [GET /api/agent (card), POST /api/agent (JSON-RPC)]
    json: [GET /api/ai/context, GET /api/ai/services, GET /api/ai/portfolio]
  detail: >-
    No Authorization header, API key, cookie or session is required or documented. CORS is open
    (access-control-allow-origin: *). Caller identity for the write tools is the name/email in the
    arguments, which p0stman receives as an enquiry.
