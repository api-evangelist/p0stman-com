- aid: p0stman-com:zero-a2a-agent
  name: Zero A2A Agent
  description: >-
    p0stman's agent-to-agent surface: an A2A agent card for "Zero" served at /.well-known/agent-card.json
    (and the legacy /.well-known/agent.json) on p0stman.com and www.p0stman.com, pointing at an anonymous
    JSON-RPC 2.0 task endpoint at https://p0stman.com/api/agent. Three skills - inquire (services, pricing,
    capabilities), portfolio (case studies by industry) and book (schedule a 30-minute discovery call with
    Paul Gosnell) - text/plain in and out, no streaming, push notifications or task history. The card is
    flavored against A2A 1.0.0 (no protocolVersion, pre-0.3 authentication.schemes).
  image: https://p0stman.com/icon-512.png
  humanURL: https://p0stman.com/what-is-a2a-protocol
