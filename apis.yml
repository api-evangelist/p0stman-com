- aid: p0stman-com:p0stman-ai-context-api
  name: p0stman AI Context API
  description: >-
    Three anonymous JSON endpoints documented in agents.md for agents that do not speak MCP: GET
    /api/ai/context (company, services, case_studies, contact, how_to_engage, mcp_endpoint), GET
    /api/ai/services (services with slug, price_from, currency, timeline, url and subOffers) and GET
    /api/ai/portfolio (case studies with slug, title, industry, summary, tech, timeline, url). Read-only,
    CORS-open, no OpenAPI published - the response shapes are described in prose only.
  image: https://p0stman.com/icon-512.png
