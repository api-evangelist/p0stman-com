aid: p0stman-com
name: p0stman
description: >-
  p0stman is an AI-native product studio operated by Thrive Venture Labs Ltd (Norfolk and London, UK),
  founded by Paul Gosnell. It builds AI voice agents, AI automation, operations command centres, rapid MVPs
  and "agentic web readiness" rebuilds for clients at fixed prices from £1,500-£8,000, and it uses its own
  site as the demonstration: p0stman.com serves a live anonymous MCP server at /api/mcp (five tools, JSON-RPC
  2.0, protocol 2024-11-05), an A2A agent card for its assistant "Zero" at /.well-known/agent-card.json with
  a task endpoint at /api/agent, machine-readable JSON at /api/ai/context, /api/ai/services and
  /api/ai/portfolio, plus llms.txt, agents.md, context.md and a root mcp.json manifest. No OpenAPI, SDK,
  OAuth surface or developer sign-up is published - the whole API is free, anonymous and read-mostly, with two
  write tools that book a discovery call or send an enquiry. Not the Postman API platform.
image: https://p0stman.com/icon-512.png
