description: >-
  How p0stman's agent surface behaves across every call: anonymous JSON-RPC 2.0 over HTTPS POST for both MCP
  and A2A, plain JSON GETs for the three /api/ai endpoints, no idempotency mechanism on the two writes, no
  pagination, no request tracing, no versioning scheme beyond a "1.0.0" serverInfo string, JSON-RPC error
  envelopes, and no rate-limit signalling. The write surface is two enquiry tools whose effect is a message
  to a person; neither has a documented reversal.
base_url: https://p0stman.com
api_style: >-
  JSON-RPC 2.0 over HTTPS POST at /api/mcp (MCP, protocol 2024-11-05) and /api/agent (A2A); plain JSON over
  HTTPS GET at /api/ai/context, /api/ai/services, /api/ai/portfolio. All responses application/json; CORS *.
