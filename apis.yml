apis:
- aid: p0stman-com:p0stman-mcp-server
  name: p0stman MCP Server
  description: >-
    Live, anonymous, remote Model Context Protocol server at https://p0stman.com/api/mcp (JSON-RPC 2.0 over
    HTTPS POST, protocol 2024-11-05, tools primitive only). Five tools: get_services (services with GBP
    "from" prices and timelines), get_portfolio (case studies, filterable by industry), search_content
    (guides and pages), and two writes - book_discovery_call and submit_inquiry - that send a real enquiry to
    the founder. No authentication, no rate limit published, no idempotency or reversal path on the writes.
    Documented in agents.md with a JSON-RPC example per tool; advertised in llms.txt, context.md and
    /mcp.json; robots.txt explicitly allows the path.
  image: https://p0stman.com/icon-512.png
  humanURL: https://p0stman.com/agents.md
  baseURL: https://p0stman.com/api/mcp
