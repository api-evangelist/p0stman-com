description: >-
  p0stman ships a live, anonymous, remote MCP server at https://p0stman.com/api/mcp (JSON-RPC 2.0 over HTTPS
  POST, no session handshake required). It is advertised in llms.txt, agents.md, context.md and a root
  /mcp.json manifest, and robots.txt explicitly allows /api/mcp. Probed 2026-09-19: initialize answered with
  protocolVersion 2024-11-05 and serverInfo {name: "p0stman MCP Server", version: "1.0.0"}, capabilities
  {tools: {}} only; tools/list returned five tools with full inputSchema (saved verbatim to
  p0stman-com-tools-list.json). resources/list, prompts/list and ping all return -32601 Method not found, so
  the server is tools-only. The read tools were exercised live (get_services returned the services JSON,
  search_content returned an empty result set for "rate limit"); the two write tools - book_discovery_call
  and submit_inquiry - were NOT called, because each creates a real enquiry with a real person. No OpenAPI
  exists to bind these tools to, so there is no tool crosswalk; the same data is served as plain JSON at
  /api/ai/context, /api/ai/services and /api/ai/portfolio. The official MCP registry
  (registry.modelcontextprotocol.io) has no p0stman entry.
